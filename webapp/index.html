<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Панчлайн — Карточная игра</title>

  <!-- Иконка во вкладке браузера (Favicon) -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logo-32.png">
  <link rel="apple-touch-icon" href="assets/logo-192.png">

  <!-- Окрашивание поисковой / адресной строки браузера под тему приложения -->
  <meta name="theme-color" content="#17212b">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- Экран установки PWA (для внешнего браузера) -->
    <div id="install-screen" class="screen">
      <div class="card-box" style="text-align: center;">
        <img src="assets/logo-192.png" alt="Панчлайн" class="app-logo-large" style="width: 80px; height: 80px; margin: 0 auto 12px; border-radius: 20px;">
        <h1>Панчлайн</h1>
        <p>Установите приложение для комфортной игры</p>
        <button id="pwa-install-trigger" class="btn primary">📱 Установить PWA</button>
      </div>
    </div>

    <!-- Экран Лобби -->
    <div id="lobby-screen" class="screen">
      <div class="lobby-header" style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px;">
        <img src="assets/logo-192.png" alt="Аватар игры" style="width: 42px; height: 42px; border-radius: 12px;">
        <h1 style="margin: 0;">Панчлайн</h1>
      </div>

      <div class="card-box">
        <button id="create-room-btn" class="btn primary">➕ Создать новую комнату</button>
        <button id="solo-bot-btn" class="btn secondary" style="background: #3e546a;">🤖 Играть соло (с 3 ботами)</button>
        
        <div class="divider">или войти по коду</div>
        
        <input type="text" id="room-code-input" placeholder="Введите код комнаты" maxlength="6">
        <button id="join-room-btn" class="btn secondary">Войти в комнату</button>
      </div>
    </div>

    <!-- Игровой экран -->
    <div id="game-screen" class="screen">
      <div class="header">
        <div style="display: flex; align-items: center; gap: 8px;">
          <img src="assets/logo-32.png" alt="Лого" style="width: 24px; height: 24px; border-radius: 6px;">
          <span id="room-info">Комната: ...</span>
        </div>
        <span id="role-badge" class="badge">Игрок</span>
      </div>

      <!-- Панель таймера Лобби -->
      <div id="lobby-panel" style="background: #2a3b4c; padding: 12px; border-radius: 12px; text-align: center;">
        <div>⏱️ До автостарта: <b id="lobby-timer">60</b> сек</div>
        <button id="start-now-btn" class="btn primary" style="margin-top: 8px; background: #27ae60;">
          🚀 Начать прямо сейчас
        </button>
      </div>

      <!-- Вопрос раунда -->
      <div id="question-text" class="question-card">
        Ожидание карточки вопроса...
      </div>

      <div class="section-title">Карты на столе:</div>
      <div id="table-cards" class="cards-grid"></div>

      <div class="section-title">Ваша рука:</div>
      <div id="cards-hand" class="cards-grid"></div>

      <div class="section-title">Счет участников:</div>
      <div id="score-board" class="score-list"></div>
    </div>

  </div>

  <!-- Диалоговое окно добавления ботов -->
  <div id="bot-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: #1e293b; color: white; padding: 20px; border-radius: 16px; max-width: 320px; text-align: center;">
      <h3 id="bot-modal-title">Не хватает игроков!</h3>
      <p id="bot-modal-text" style="margin: 10px 0; color: #94a3b8;"></p>
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button id="bot-modal-yes" class="btn primary" style="flex: 1;">Да</button>
        <button id="bot-modal-no" class="btn secondary" style="flex: 1; background: #e74c3c;">Нет</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
